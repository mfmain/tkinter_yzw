[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tkinter-yzw"
version = "1.0"
description = "UI as an Independent Module: As Simple as Using print, Interacting with an Event-Driven MainApp"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Oliver Yang", email = "mfmain@sina.com" },
]
keywords = ["tkinter", "ui", "widgets", "treeview", "mainloop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "sortedcontainers",
    "PyYAML",
]

[project.optional-dependencies]
tools = [
    "pywin32; sys_platform == 'win32'",
    "redis",
    "exifread",
]

[project.urls]
Homepage = "https://github.com/mfmain/tkinter_yzw"

[tool.setuptools]
packages = ["tkinter_yzw"]

[tool.setuptools.package-dir]
tkinter_yzw = "."
